<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Generador de Exámenes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <script src="init-db.js"></script>
    <script src="database.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-700 to-green-900">
    <header class="bg-white/10 border-b border-white/20 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-shield-alt text-white text-2xl"></i>
                <h1 class="text-white font-bold">Panel Administrador</h1>
            </div>
            <button id="logoutAdmin" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">Salir</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Login -->
        <section id="adminLoginSection" class="max-w-md mx-auto bg-white/10 border border-white/20 rounded-xl p-6">
            <h2 class="text-white text-xl font-semibold mb-4">Acceso Administrador</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-white block mb-1">Usuario</label>
                    <input id="adminUser" type="text" class="w-full px-3 py-2 rounded bg-white/20 border border-white/30 text-white" placeholder="Usuario" />
                </div>
                <div>
                    <label class="text-sm text-white block mb-1">Clave</label>
                    <input id="adminPass" type="password" class="w-full px-3 py-2 rounded bg-white/20 border border-white/30 text-white" placeholder="Clave" />
                </div>
                <button id="adminLoginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Ingresar</button>
                <div id="adminMsg" class="hidden p-3 rounded text-sm"></div>
            </div>
        </section>

        <!-- Dashboard -->
        <section id="adminDashboard" class="hidden space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white/10 border border-white/20 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-white font-semibold"><i class="fas fa-users mr-2"></i>Usuarios (Alumnos)</h3>
                        <span id="countAlumnos" class="text-white/80 text-sm">0</span>
                    </div>
                    <div class="overflow-auto">
                        <table class="min-w-full text-sm text-white/90">
                            <thead class="text-white/70">
                                <tr>
                                    <th class="text-left py-2 pr-3">Nombre</th>
                                    <th class="text-left py-2 pr-3">Email</th>
                                    <th class="text-left py-2 pr-3">Registro</th>
                                    <th class="text-left py-2">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableAlumnos"></tbody>
                        </table>
                    </div>
                </div>
                <div class="bg-white/10 border border-white/20 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-white font-semibold"><i class="fas fa-chalkboard-teacher mr-2"></i>Usuarios (Profesores)</h3>
                        <span id="countProfes" class="text-white/80 text-sm">0</span>
                    </div>
                    <div class="overflow-auto">
                        <table class="min-w-full text-sm text-white/90">
                            <thead class="text-white/70">
                                <tr>
                                    <th class="text-left py-2 pr-3">Nombre</th>
                                    <th class="text-left py-2 pr-3">Email</th>
                                    <th class="text-left py-2 pr-3">Registro</th>
                                    <th class="text-left py-2">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableProfes"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="bg-white/10 border border-white/20 rounded-xl p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-white font-semibold"><i class="fas fa-file-alt mr-2"></i>Exámenes publicados</h3>
                    <button id="refreshExams" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded text-sm">Refrescar</button>
                </div>
                <div class="overflow-auto">
                    <table class="min-w-full text-sm text-white/90">
                        <thead class="text-white/70">
                            <tr>
                                <th class="text-left py-2 pr-3">Código</th>
                                <th class="text-left py-2 pr-3">Título</th>
                                <th class="text-left py-2 pr-3">Materia</th>
                                <th class="text-left py-2 pr-3">Preguntas</th>
                                <th class="text-left py-2">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableExams"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Ver Examen -->
    <div id="examViewModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-white/10 border border-white/20 rounded-xl p-6 max-w-3xl w-full mx-4 max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h4 class="text-white font-semibold">Vista de Examen</h4>
                <button id="closeExamView" class="text-white hover:text-red-300 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <div id="examViewContent" class="space-y-3 text-white"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
